name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK; this just caches Gradle.
      - uses: gradle/actions/setup-gradle@v6

      # Decodes the permanent signing key if the repo has it (secrets aren't available on fork PRs).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RATEGURU_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rateguru.p12"
          echo "RATEGURU_KEYSTORE_FILE=$RUNNER_TEMP/rateguru.p12" >> "$GITHUB_ENV"
        shell: bash

      # On a tag like v0.1.2 the app version comes from the tag; installed apps see it as an update.
      - name: Build APK
        env:
          RATEGURU_KEYSTORE_PASSWORD: ${{ secrets.RATEGURU_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --no-daemon -PappVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew assembleRelease --no-daemon
          fi
        shell: bash

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"
        shell: bash

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RateGuru-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}.apk
        shell: bash

      # A fixed name too, so https://github.com/getguruhat/RateGuru/releases/latest/download/RateGuru.apk
      # always points at the newest release (used by guruhat.com's download link).
      - name: Stable APK name
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp RateGuru-${{ github.ref_name }}.apk RateGuru.apk

      - uses: actions/upload-artifact@v7
        with:
          name: RateGuru-apk
          path: RateGuru-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            RateGuru-*.apk
            RateGuru.apk
          generate_release_notes: true
